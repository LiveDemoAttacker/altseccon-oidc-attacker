name: Deploy (trusted default-branch workflow_run only)

on:
  workflow_run:
    workflows: ["CI (safe PR tests)"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout the exact successful default-branch commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Request a real OIDC token and display safe claims only
        uses: actions/github-script@v7
        with:
          script: |
            const jwt = await core.getIDToken("altseccon-demo");
            const payload = JSON.parse(
              Buffer.from(jwt.split(".")[1], "base64url").toString("utf8")
            );

            core.info(JSON.stringify({
              iss: payload.iss,
              aud: payload.aud,
              sub: payload.sub,
              repository: payload.repository,
              ref: payload.ref
            }, null, 2));

            // Never log, persist, or transmit the JWT. It remains in memory
            // only long enough to demonstrate the trusted workflow identity.
